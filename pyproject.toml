[project]
name = "signalfusion"
version = "0.1.0"
description = "Cross-modal attention transformer for crypto trading signals"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "numpy>=2.0",
    "pandas>=2.2",
    "httpx>=0.27",
    "websockets>=13.0",
    "aiosqlite>=0.20",
    "scikit-learn>=1.5",
    "pyarrow>=17.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
